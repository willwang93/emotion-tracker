<span class="font-label-lg text-label-lg">Relaxed</span>
<span class="check-icon hidden material-symbols-outlined text-[18px]">check</span>
</button>

<span class="font-label-lg text-label-lg">Content</span>

<span class="font-label-lg text-label-lg">At ease</span>

</button>
<!-- Secure -->
<button class="emotion-chip flex items-center gap-2 px-5 py-3.5 rounded-full bg-surface-container-lowest text-on-surface transition-all duration-200 active:scale-95 shadow-sm" data-emotion="Secure" type="button">

</button>

</button>
</div>
</div>
<!-- Bottom Action Bar (Thumb Zone) -->
<div class="w-full pt-8 pb-4">
<button class="w-full h-14 rounded-full bg-primary-container hover:bg-primary text-on-primary font-label-lg text-label-lg flex items-center justify-center shadow-lg transition-all duration-200 active:scale-[0.98]" type="button">
      Next
    </button>
</div>
</div>
<script>
  (() => {
    const chips = document.querySelectorAll('.emotion-chip');
    chips.forEach(chip => {
      chip.addEventListener('click', () => {
        chips.forEach(c => {
          c.classList.remove('bg-tertiary-fixed', 'text-on-tertiary-fixed');
          c.classList.add('bg-surface-container-lowest', 'text-on-surface');
          const check = c.querySelector('.check-icon');
          if (check) check.classList.add('hidden');
        });
        chip.classList.remove('bg-surface-container-lowest', 'text-on-surface');
        chip.classList.add('bg-tertiary-fixed', 'text-on-tertiary-fixed');
        const activeCheck = chip.querySelector('.check-icon');
        if (activeCheck) activeCheck.classList.remove('hidden');
      });
    });
  })();
</script></main>
