<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><style>@layer base{html,body{width:100vw;margin:0;padding:0;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script><script id="tailwind-config">

</script></head><body class="bg-surface text-on-surface antialiased selection:bg-primary-fixed select-none" style="background-color: #fef9ee; font-family: 'Plus Jakarta Sans', sans-serif;"><header class="fixed top-0 inset-x-0 z-50 pt-safe bg-surface/90 backdrop-blur-md"><div class="h-16 px-5 flex items-center justify-between"><button aria-label="Return" class="w-10 h-10 flex items-center justify-center text-[#1c1917] hover:opacity-75 transition-opacity rounded-full active:scale-95" onclick="history.back()"><span class="material-symbols-outlined text-[24px]">arrow_back</span></button><h1 class="text-[17px] font-semibold text-[#1c1917] tracking-tight">Emotion Check In</h1><button aria-label="Profile" class="w-10 h-10 flex items-center justify-center rounded-full hover:opacity-90 active:scale-95 transition-opacity"><div class="w-8 h-8 rounded-full bg-[#964900] flex items-center justify-center text-white"><span class="material-symbols-outlined text-[19px]">person</span></div></button></div></header><main class="relative w-full max-w-md mx-auto pt-20 px-6 pb-safe min-h-screen flex flex-col justify-between"><div class="w-full pt-4"><div class="mb-6"><h2 class="text-[28px] sm:text-[32px] text-[#1c1917] font-bold tracking-tight leading-[1.2]">What is causing this emotion?</h2></div><div class="relative w-full rounded-3xl p-6 transition-all duration-300 border border-[#dec1af]/30 shadow-sm focus-within:border-[#964900]/40 focus-within:shadow-md" style="background-color: #f7f3ea; min-height: 290px;"><label class="sr-only" for="reflection-input">What is causing this emotion?</label><textarea autofocus="" class="w-full bg-transparent resize-none border-0 outline-none p-0 text-[16px] text-[#1c1917] placeholder:text-[#8b7263]/55 focus:ring-0 leading-relaxed font-normal" id="reflection-input" placeholder="" rows="10" style="opacity: 0;"></textarea></div></div><div class="w-full pb-8 pt-4"><button class="w-full flex items-center justify-center py-4 px-6 rounded-full text-white font-bold text-[16px] tracking-wide transition-all duration-200 active:scale-[0.98] hover:opacity-95" id="submit-thought-btn" onclick="saveThought()" style="background-color: #f57c00; box-shadow: 0px 8px 24px rgba(245, 124, 0, 0.32);" type="button">Done</button></div></main><script>
  function saveThought() {
    const btn = document.getElementById('submit-thought-btn');
    if (!btn) return;
    btn.innerHTML = '<span class="material-symbols-outlined text-[20px] animate-spin mr-2">progress_activity</span> Saving...';
    btn.classList.add('opacity-90');
    setTimeout(() => {
      btn.innerHTML = '<span class="material-symbols-outlined text-[20px] mr-2">check</span> Done';
      setTimeout(() => {
        window.history.back();
      }, 400);
    }, 500);
  }
</script>
