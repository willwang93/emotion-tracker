<script>
  (function() {
    const cards = document.querySelectorAll('.emotion-card');
    cards.forEach(card => {
      card.addEventListener('click', () => {
        // Clear active borders & badges from all cards
        cards.forEach(c => {
          c.classList.remove('border-[#1b6c40]', 'border-[#ba1a1a]', 'border-[#f57c00]', 'border-[#194be2]');
          c.classList.add('border-transparent');
          const badge = c.querySelector('.check-badge');
          if (badge) badge.remove();
        });

        // Determine accent colors
        const borderColor = card.dataset.borderColor || '#1b6c40';
        let badgeBg = 'bg-tertiary';
        if (card.dataset.emotion === 'high-unpleasant') {
          badgeBg = 'bg-error';
        } else if (card.dataset.emotion === 'high-pleasant') {
          badgeBg = 'bg-primary-container';
        } else if (card.dataset.emotion === 'low-unpleasant') {
          badgeBg = 'bg-secondary';
        }

        card.classList.remove('border-transparent');
        card.classList.add(`border-[${borderColor}]`);

        // Insert check badge
        const badge = document.createElement('div');
        badge.className = `check-badge absolute top-3 right-3 w-6 h-6 rounded-full ${badgeBg} text-white flex items-center justify-center shadow-sm z-20`;
        badge.innerHTML = `<span class="material-symbols-outlined text-[16px] leading-none" style="font-variation-settings: 'FILL' 1;">check</span>`;
        card.appendChild(badge);
      });
    });
  })();
</script></main>
