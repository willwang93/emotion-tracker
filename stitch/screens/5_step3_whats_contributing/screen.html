ols-outlined text-[18px] text-outline">heart_check</span><span>Partner</span><span class="check-icon hidden material-symbols-outlined text-[16px] text-tertiary">check</span></button><button class="group flex items-center gap-1.5 px-4 py-2.5 rounded-full bg-surface-container-low text-on-surface-variant font-label-lg text-label-lg transition-all duration-200 active:scale-95 shadow-sm hover:bg-surface-container" onclick="toggleChip(this)" type="button"><span class="material-symbols-outlined text-[18px] text-outline">badge</span><span>Coworkers</span><span class="check-icon hidden material-symbols-outlined text-[16px] text-tertiary">check</span></button><button class="group flex items-center gap-1.5 px-4 py-2.5 rounded-full bg-surface-container-low text-on-surface-variant font-label-lg text-label-lg transition-all duration-200 active:scale-95 shadow-sm hover:bg-surface-container" onclick="toggleChip(this)" type="button"><span class="material-symbols-outlined text-[18px] text-outline">school</span><span>Classmates</span><span class="check-icon hidden material-symbols-outlined text-[16px] text-tertiary">check</span></button><button class="group flex items-center gap-1.5 px-4 py-2.5 rounded-full bg-surface-container-low text-on-surface-variant font-label-lg text-label-lg transition-all duration-200 active:scale-95 shadow-sm hover:bg-surface-container" onclick="toggleChip(this)" type="button"><span class="material-symbols-outlined text-[18px] text-outline">support_agent</span><span>Clients</span><span class="check-icon hidden material-symbols-outlined text-[16px] text-tertiary">check</span></button></div></section><section class="flex flex-col gap-3 mt-2"><span class="font-label-md text-label-md text-on-surface-variant px-1 font-semibold">Place</span><div aria-label="Place context options" class="flex flex-wrap gap-2" role="group"><button class="group flex items-center gap-1.5 px-4 py-2.5 rounded-full bg-surface-container-low text-on-surface-variant font-label-lg text-label-lg transition-all duration-200 active:scale-95 shadow-sm hover:bg-surface-container" onclick="toggleChip(this)" type="button"><span class="material-symbols-outlined text-[18px] text-outline">cottage</span><span>Home</span><span class="check-icon hidden material-symbols-outlined text-[16px] text-tertiary">check</span></button><button class="group flex items-center gap-1.5 px-4 py-2.5 rounded-full bg-surface-container-low text-on-surface-variant font-label-lg text-label-lg transition-all duration-200 active:scale-95 shadow-sm hover:bg-surface-container" onclick="toggleChip(this)" type="button"><span class="material-symbols-outlined text-[18px] text-outline">domain</span><span>Work</span><span class="check-icon hidden material-symbols-outlined text-[16px] text-tertiary">check</span></button><button class="group flex items-center gap-1.5 px-4 py-2.5 rounded-full bg-surface-container-low text-on-surface-variant font-label-lg text-label-lg transition-all duration-200 active:scale-95 shadow-sm hover:bg-surface-container" onclick="toggleChip(this)" type="button"><span class="material-symbols-outlined text-[18px] text-outline">apartment</span><span>School</span><span class="check-icon hidden material-symbols-outlined text-[16px] text-tertiary">check</span></button><button class="group flex items-center gap-1.5 px-4 py-2.5 rounded-full bg-surface-container-low text-on-surface-variant font-label-lg text-label-lg transition-all duration-200 active:scale-95 shadow-sm hover:bg-surface-container" onclick="toggleChip(this)" type="button"><span class="material-symbols-outlined text-[18px] text-outline">commute</span><span>Transit</span><span class="check-icon hidden material-symbols-outlined text-[16px] text-tertiary">check</span></button><button class="selected group flex items-center gap-1.5 px-4 py-2.5 rounded-full bg-tertiary-fixed text-on-tertiary-fixed font-label-lg text-label-lg transition-all duration-200 active:scale-95 shadow-sm" onclick="toggleChip(this)" type="button"><span class="material-symbols-outlined text-[18px] text-tertiary" style="font-variation-settings: 'FILL' 1;">nature_people</span><span>Outdoors</span><span class="check-icon material-symbols-outlined text-[16px] text-tertiary">check</span></button><button class="group flex items-center gap-1.5 px-4 py-2.5 rounded-full bg-surface-container-low text-on-surface-variant font-label-lg text-label-lg transition-all duration-200 active:scale-95 shadow-sm hover:bg-surface-container" onclick="toggleChip(this)" type="button"><span class="material-symbols-outlined text-[18px] text-outline">fitness_center</span><span>Gym</span><span class="check-icon hidden material-symbols-outlined text-[16px] text-tertiary">check</span></button><button class="group flex items-center gap-1.5 px-4 py-2.5 rounded-full bg-surface-container-low text-on-surface-variant font-label-lg text-label-lg transition-all duration-200 active:scale-95 shadow-sm hover:bg-surface-container" onclick="toggleChip(this)" type="button"><span class="material-symbols-outlined text-[18px] text-outline">local_cafe</span><span>Cafe/Restaurant</span><span class="check-icon hidden material-symbols-outlined text-[16px] text-tertiary">check</span></button></div></section></div>
<!-- Anchored Sticky Action Dock -->
<div class="sticky bottom-0 left-0 right-0 pt-6 pb-6 mt-6 bg-gradient-to-t from-surface via-surface to-transparent">
<button class="w-full h-14 rounded-full bg-primary-container text-on-primary font-label-lg text-label-lg flex items-center justify-center gap-2 shadow-[0px_8px_24px_rgba(245,124,0,0.28)] hover:brightness-105 active:scale-[0.98] transition-all" id="save-btn" onclick="saveCheckIn()" type="button"><span>Continue</span><span class="material-symbols-outlined text-[20px]">arrow_forward</span></button>
</div>
</div>
<script>
  function toggleChip(button) {
    const isSelected = button.classList.contains('selected');
    const checkIcon = button.querySelector('.check-icon');
    const icon = button.querySelector('.material-symbols-outlined:not(.check-icon)');

    if (isSelected) {
      button.classList.remove('selected', 'bg-tertiary-fixed', 'text-on-tertiary-fixed');
      button.classList.add('bg-surface-container-low', 'text-on-surface-variant');
      if (checkIcon) checkIcon.classList.add('hidden');
      if (icon) {
        icon.classList.remove('text-tertiary');
        icon.classList.add('text-outline');
        icon.style.fontVariationSettings = "'FILL' 0";
      }
    } else {
      button.classList.add('selected', 'bg-tertiary-fixed', 'text-on-tertiary-fixed');
      button.classList.remove('bg-surface-container-low', 'text-on-surface-variant');
      if (checkIcon) checkIcon.classList.remove('hidden');
      if (icon) {
        icon.classList.add('text-tertiary');
        icon.classList.remove('text-outline');
        icon.style.fontVariationSettings = "'FILL' 1";
      }
    }
  }

  function saveCheckIn() {
    const btn = document.getElementById('save-btn');
    btn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[20px]">progress_activity</span><span>Saved</span>';
    btn.classList.add('bg-tertiary', 'text-on-tertiary');
    btn.classList.remove('bg-primary-container');
    setTimeout(() => {
      if (window.history && window.history.length > 1) {
        window.history.back();
      }
    }, 600);
  }
</script></main></body></html>
